[project]
name = "coursework-one"
version = "0.1.0"
description = "\"Big Data Investment Pipeline\""
authors = [
    {name = "Vivi Sampelan"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<3.15"
dependencies = [
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "kafka-python (>=2.3.0,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)",
    "yfinance (>=1.2.0,<2.0.0)",
    "scipy (>=1.17.1,<2.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.0,<9.0.0)",
    "bandit (>=1.9.3,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["a_pipeline/test", "b_pipeline/test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["a_pipeline/modules", "b_pipeline/modules"]
omit = ["test/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[project]
name = "coursework-one"
version = "0.1.0"
description = "\"Big Data Investment Pipeline\""
authors = [
    {name = "Vivi Sampelan"}
]
license = {text = "MIT"}
requires-python = ">=3.11,<3.15"
dependencies = [
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pymongo (>=4.16.0,<5.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "kafka-python (>=2.3.0,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pyarrow (>=23.0.0,<24.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"



